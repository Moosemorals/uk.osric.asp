#
# The mail pod runs rootless as `vmail` and publishes 25, 587 and 993. The publisher is pasta running
# in the host namespace as that user, so the floor applies to it: without this it refuses every port
# below 1024 with "Failed to bind port 25 (Permission denied)".
#
# The cost is plain and accepted: any local user may now bind a privileged port. One human and two
# service accounts share this host, and a second tenant is the moment to revisit it.
net.ipv4.ip_unprivileged_port_start=25
