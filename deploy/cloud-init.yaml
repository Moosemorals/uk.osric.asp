# Debian 13 (trixie) bootstrap for the Hetzner Cloud VM.
# Pass this as the server's user-data; deploy/README.md has the containerised `hcloud`
# invocation, so nothing has to be installed locally beyond podman.
# It prepares the host only: the app runs rootless as the deploy user, Caddy runs rootful as the
# public edge, and `make deploy` installs the quadlets and the image.
#
# The VM is 1 vCPU, 1 GB of RAM and 20 GB of disk. The swap file below is part of the memory budget
# rather than an optional extra: the app is capped at 768 MB and is not allowed to page, so the swap
# is where everything that is not the app lives when the box is tight.

package_update: true
package_upgrade: true
# An upgraded kernel is not running until the machine reboots, so take the reboot now rather than
# discovering a stale kernel at some later date.
package_reboot_if_required: true
timezone: Europe/London
# cloud-init splits a dotted hostname: short name "moosemorals", fqdn "moosemorals.com".
hostname: moosemorals.com
ssh_pwauth: false

users:
  - name: deploy
    groups: [sudo]
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIA8mzVwKRsF2RcKGo9EYHfQTavwD+Y+zM1YB7BbZvXTY osric@lucy
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJW4Kmr2GndxBJ13y1udp20C9MvnLzlbnPbgDWbzWu1z osric@Carrot

packages:
  # Rootless podman: id mapping, user-mode networking, and an overlay driver for user namespaces.
  - podman
  # Container-name resolution on a user-defined network is a package of its own on Debian: Prometheus
  # scrapes `app:8080`, and without aardvark-dns that name resolves nowhere.
  - aardvark-dns
  - uidmap
  - passt
  - slirp4netns
  - fuse-overlayfs
  - dbus-user-session
  - ufw
  - unattended-upgrades
  - sqlite3
  - ca-certificates
  - curl
  - btop

write_files:
  - path: /etc/ssh/sshd_config.d/10-hardening.conf
    permissions: "0644"
    content: |
      PasswordAuthentication no
      PermitRootLogin prohibit-password

runcmd:
  # 2 GiB of swap on the volume the containers and the database already share. The app's cgroup cannot
  # use it (`--memory-swap=768m`), so what it buys is headroom for Caddy, Prometheus, podman and the
  # kernel: on 1 GB of RAM a burst — an image pull beside an app restart, an unattended upgrade —
  # otherwise has no room at all, and the OOM killer picks whichever process scored highest.
  # `fallocate` needs ext4 or xfs, which the Debian image's root is; on btrfs the file has to be
  # written with `dd` after `chattr +C /swapfile`.
  - fallocate -l 2G /swapfile
  - chmod 600 /swapfile
  - mkswap /swapfile
  - echo '/swapfile none swap sw,nofail 0 0' >> /etc/fstab
  - swapon /swapfile
  # Rootless podman needs subordinate id ranges and a user manager that outlives the login session.
  - grep -q '^deploy:' /etc/subuid && grep -q '^deploy:' /etc/subgid || usermod --add-subuids 100000-165535 --add-subgids 100000-165535 deploy
  - loginctl enable-linger deploy
  # install(1) applies owner and mode to the last component only, so every level is named here.
  - install -d -o deploy -g deploy -m 0755 /home/deploy/.config /home/deploy/.config/containers
  - install -d -o deploy -g deploy -m 0755 /home/deploy/.config/containers/systemd
  # The Caddyfile is root-owned: rootful Caddy must not load configuration the deploy user can rewrite.
  - install -d -o root -g root -m 0755 /etc/caddy
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 22/tcp
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw allow 443/udp
  - ufw --force enable
  - systemctl enable --now unattended-upgrades
  # Validate before reloading, so a broken drop-in fails here rather than silently leaving the old
  # configuration in place.
  - sshd -t && systemctl reload ssh
  # Proves the rootless stack works before the first deploy; runcmd reports a failure through
  # `cloud-init status --long` and nothing later depends on this.
  - su - deploy -c 'podman info --format "{{.Host.Security.Rootless}}"'
