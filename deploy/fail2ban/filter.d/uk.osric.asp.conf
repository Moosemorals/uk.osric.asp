#
# The one pattern the host bans on. `make deploy` installs it to
# /etc/fail2ban/filter.d/uk.osric.asp.conf; deploy/ is the source of truth for the host.
#
# The app logs one JSON object per line, scopes included, and the sentence is the value of
# "Message":
#
#   {"Timestamp":"...","LogLevel":"Information","Category":"uk.osric.asp.Authentication",
#    "Message":"Authentication failed: 203.0.113.7 GET /hue/ws (sent to sign in)", ...}
#
# The address follows the words immediately, so <HOST> can take it and everything after it is left
# to the person reading the journal. The category is part of the pattern as well as the sentence: a
# page's own log line is filed under another category, so a page that happens to write these words
# cannot get an address banned.

[Definition]
failregex = ^.*"Category":"uk\.osric\.asp\.Authentication".*"Message":"Authentication failed: <HOST>
