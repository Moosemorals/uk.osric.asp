    <!--
    Colours are presentation attributes rather than a stylesheet: this page is served under the
    site's content security policy, which refuses inline style elements and style attributes.
    -->
    <defs>
        <linearGradient id="thrust" x1="1" y1="0.5" x2="0" y2="0.5">
            <!-- Engine exhaust cone, red to orange to yellow, fading out further from the ship  -->
            <stop stop-color="hsl(0,100%,50%)" offset="0%"/>
            <stop stop-color="hsl(30,100%,50%)" stop-opacity="0.5" offset="50%"/>
            <stop stop-color="hsl(60,100%,50%)" stop-opacity="0" offset="100%"/>
        </linearGradient>
        <linearGradient id="hullPaint" x1="0.5" y1="0" x2="0.5" y2="1">
            <!-- Along the axis of the hull to make it look rounded-->
            <stop stop-color="hsl(200,100%,30%)" offset="0%"/>
            <stop stop-color="hsl(200,100%,75%)" offset="45%"/>
            <stop stop-color="hsl(200,100%,75%)" offset="55%"/>
            <stop stop-color="hsl(200,100%,30%)" offset="100%"/>
        </linearGradient>
        <linearGradient id="noseCone" x1="0.5" y1="0" x2="0.5" y2="1">
            <!-- A tighter version of hull for a smaller shape -->
            <stop stop-color="hsl(200,100%,30%)" offset="0%"/>
            <stop stop-color="hsl(200,100%,75%)" offset="50%"/>
            <stop stop-color="hsl(200,100%,30%)" offset="100%"/>
        </linearGradient>
        <linearGradient id="engineCone" x1="0.5" y1="0" x2="0.5" y2="1">
            <!-- Same as noseCone, but in grey -->
            <stop stop-color="hsl(0,0%,30%)" offset="0%"/>
            <stop stop-color="hsl(0,0%,75%)" offset="50%"/>
            <stop stop-color="hsl(0,0%,30%)" offset="100%"/>
        </linearGradient>
        <linearGradient id="leftWing" x1="1.05" y1="0" x2="-0.25" y2="1">
            <!--
            Left/Right wings are the same - the axis of the gradient
            should run along the center of the triangle from the tip
            to the hull. (Actually, it's guesswork).
            Top wing same colors but inverted.
            -->
            <stop stop-color="hsl(230,60%,30%)" offset="30%"/>
            <stop stop-color="hsl(230,60%,60%)" offset="50%"/>
            <stop stop-color="hsl(230,60%,30%)" offset="70%"/>
        </linearGradient>
        <linearGradient id="rightWing" x1="1.05" y1="1" x2="-0.25" y2="0">
            <stop stop-color="hsl(230,60%,30%)" offset="30%"/>
            <stop stop-color="hsl(230,60%,60%)" offset="50%"/>
            <stop stop-color="hsl(230,60%,30%)" offset="70%"/>
        </linearGradient>
        <linearGradient id="topWing" x1="0.5" y1="0" x2="0.5" y2="1">
            <stop stop-color="hsl(230,60%,60%)" offset="10%"/>
            <stop stop-color="hsl(230,60%,30%)" offset="50%"/>
            <stop stop-color="hsl(230,60%,60%)" offset="90%"/>
        </linearGradient>
        <linearGradient id="sky" x1="0" y1="1" x2="0" y2="0">
            <!-- Simple blue to black graidient -->
            <stop stop-color="hsl(200, 100%, 50%)" offset="20%"/>
            <stop stop-color="hsl(200, 10%, 10%)" offset="90%"/>
        </linearGradient>
        <radialGradient id="window" cx="0.7" cy="0.3">
            <!-- Rough specular highlight -->
            <stop stop-color="#fff" offset="20%"/>
            <stop stop-color="hsl(180,90%,50%)" offset="100%"/>
        </radialGradient>
    </defs>
    <!--
    <rect id="skyBox" x="0" y="0" width="100%" height="100%" fill="url('#sky')" />
    -->
    <svg viewBox="-16 -16 32 32" x="10%" y="10%" height="80%" width="80%" id="rocket">
        <g transform="rotate(-30) translate(3, 0)">
            <!-- Fins are triangles with slightly curved edges -->
            <path fill="url(#leftWing)" stroke="black" stroke-width="0.2" stroke-linejoin="round" stroke-linecap="round" d="M-6 -1 C-6 -2 -9 -5 -10 -6C-11 -7 -1 -2 0 -1Z"/>
            <path fill="url(#rightWing)" stroke="black" stroke-width="0.2" stroke-linejoin="round" stroke-linecap="round" d="M-6 1 C-6 2 -9 5 -10 6C-11 7 -1 2 0 1Z"/>
            <!-- The engine. A truncated cone -->
            <path fill="url(#thrust)" stroke="none" stroke-width="0.2" stroke-linejoin="round" stroke-linecap="round" d="M-9 -1L-15.5 -3L-15.5 3L-9 1Z"/>
            <!-- Another truncated cone -->
            <path fill="url(#engineCone)" stroke="black" stroke-width="0.2" stroke-linejoin="round" stroke-linecap="round" d="M-8 -0.5 L-9.5 -1.25L-9.5 1.25L-8 0.5Z"/>
            <!-- An oblong with slightly bulging long edges -->
            <path fill="url(#hullPaint)" stroke="black" stroke-width="0.2" stroke-linejoin="round" stroke-linecap="round" d="M-8 -1C-6 -3 6 -3 8 -1L8 1C6 3 -6 3 -8 1L-8 -1Z"/>
            <!--
            Top view of a fin. An aerofoil (a very narrow bulging rectangle)
            Located after the hull because it's drawn on top
            -->
            <path fill="url(#topWing)" stroke="black" stroke-width="0.2" stroke-linejoin="round" stroke-linecap="round" d="M0 0C-2 -1 -8 -1 -11 0C-8 1 -2 1 0 0L-11 0Z"/>

            <!-- A triangle with concave edges -->
            <path fill="url(#noseCone)" stroke="black" stroke-width="0.2" stroke-linejoin="round" stroke-linecap="round" d="M8 -1Q9 -0.3 10 0Q9 0.3 8 1M8 -1Z"/>

            <!-- A line with a circle on the end -->
            <path fill="url(#noseCone)" stroke="black" stroke-width="0.2" stroke-linejoin="round" stroke-linecap="round" d=" M10 0 L10.5 0 A0.25 0.25 180 1 1 11 0 A0.25 0.25 180 1 1 10.5 0 Z"/>

            <!-- Three cabin windows -->
            <circle fill="url(#window)" stroke="black" stroke-width="0.2" stroke-linejoin="round" stroke-linecap="round" cx="6" cy="0" r="0.75"/>
            <circle fill="url(#window)" stroke="black" stroke-width="0.2" stroke-linejoin="round" stroke-linecap="round" cx="3.9" cy="0" r="0.75"/>
            <circle fill="url(#window)" stroke="black" stroke-width="0.2" stroke-linejoin="round" stroke-linecap="round" cx="1.8" cy="0" r="0.75"/>
        </g>
    </svg>
</svg>
<% ctx.SetContentType("image/svg+xml"); ctx.SetHeader("Cache-Control", "no-cache"); %>
