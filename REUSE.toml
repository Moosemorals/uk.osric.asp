version = 1

# JSON has no comment syntax, and the licence text itself should not be edited. Everything else
# carries its two SPDX tags inline.
[[annotations]]
path = [
  "LICENSE",
  "global.json",
  ".config/dotnet-tools.json",
  "src/uk.osric.asp.Web/appsettings.json",
  "src/uk.osric.asp.Web/appsettings.Development.json",
  ".vscode/launch.json",
  ".vscode/tasks.json",
  ".vscode/extensions.json",
  "test/uk.osric.asp.Core.Tests/stryker-config.json",
  "test/uk.osric.asp.Runtime.Tests/stryker-config.json",
  "test/uk.osric.asp.Web.Tests/stryker-config.json",
  "test/uk.osric.asp.Web.Tests/stryker-sdk-config.json",
]
SPDX-FileCopyrightText = "Copyright 2026 Osric Wilkinson <osric@fluffypeople.com>"
SPDX-License-Identifier = "MIT"

# The PublicAPI files are read by an analyzer that owns their format: a comment line is parsed as an
# entry for a symbol called "# SPDX-License-Identifier", so the licence tags cannot live in them.
[[annotations]]
path = ["src/uk.osric.asp.*/PublicAPI.Shipped.txt", "src/uk.osric.asp.*/PublicAPI.Unshipped.txt"]
SPDX-FileCopyrightText = "Copyright 2026 Osric Wilkinson <osric@fluffypeople.com>"
SPDX-License-Identifier = "MIT"

# EF generates migrations and snapshots from our model.
[[annotations]]
path = ["src/uk.osric.asp.Web/Storage/Migrations/*.cs"]
SPDX-FileCopyrightText = "Copyright 2026 Osric Wilkinson <osric@fluffypeople.com>"
SPDX-License-Identifier = "MIT"

# Seeded pages that open with a template block, so they cannot carry a comment before it.
[[annotations]]
path = [
  "src/uk.osric.asp.Web/Pages/Seeds/_layout",
  "src/uk.osric.asp.Web/Pages/Seeds/admin",
  "src/uk.osric.asp.Web/Pages/Seeds/help",
]
SPDX-FileCopyrightText = "Copyright 2026 Osric Wilkinson <osric@fluffypeople.com>"
SPDX-License-Identifier = "MIT"
