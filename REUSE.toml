version = 1

# JSON has no comment syntax, and the licence text itself should not be edited. Everything else
# carries its two SPDX tags inline.
[[annotations]]
path = [
  "LICENSE",
  "global.json",
  ".config/dotnet-tools.json",
  "src/uk.osric.asp.Web/appsettings.json",
  "src/uk.osric.asp.Web/appsettings.Development.json",
  ".vscode/launch.json",
  ".vscode/tasks.json",
  ".vscode/extensions.json",
  "test/uk.osric.asp.Core.Tests/stryker-config.json",
]
SPDX-FileCopyrightText = "Copyright 2026 Osric Wilkinson <osric@fluffypeople.com>"
SPDX-License-Identifier = "MIT"

# EF generates migrations and snapshots from our model.
[[annotations]]
path = ["src/uk.osric.asp.Web/Storage/Migrations/*.cs"]
SPDX-FileCopyrightText = "Copyright 2026 Osric Wilkinson <osric@fluffypeople.com>"
SPDX-License-Identifier = "MIT"

# Seeded pages whose document opens with the doctype, so they cannot carry a comment before it.
[[annotations]]
path = [
  "src/uk.osric.asp.Web/Pages/Seeds/_layout",
  "src/uk.osric.asp.Web/Pages/Seeds/admin",
]
SPDX-FileCopyrightText = "Copyright 2026 Osric Wilkinson <osric@fluffypeople.com>"
SPDX-License-Identifier = "MIT"
